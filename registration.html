<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            padding: 20px;
        }

        .register-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #167d72;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        .input-group input:focus {
            border-color: #11998e;
            box-shadow: 0 0 5px rgba(17, 153, 142, 0.2);
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 13px;
            color: #555;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .terms input {
            margin-top: 3px;
        }

        .register-btn {
            width: 100%;
            padding: 13px;
            background: #11998e;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn:hover {
            background: #0c786f;
            transform: translateY(-2px);
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #666;
        }

        .login-link a {
            color: #11998e;
            text-decoration: none;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="register-container">

        <h1>Create Account</h1>
        <p class="subtitle">Register to get started</p>

        <form id="registerForm">

            <div class="input-group">
                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    placeholder="Enter your full name"
                    minlength="2"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Minimum 8 characters"
                    minlength="8"
                    required
                >
            </div>

            <div class="input-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    minlength="8"
                    required
                >
            </div>

            <label class="terms">
                <input type="checkbox" id="terms" required>
                <span>I agree to the Terms and Conditions.</span>
            </label>

            <button type="submit" class="register-btn">
                Create Account
            </button>

            <p id="message" role="status"></p>

        </form>

        <p class="login-link">
            Already have an account?
            <a href="login.html">Login here</a>
        </p>

    </div>

    <script>
        const registerForm = document.getElementById("registerForm");
        const password = document.getElementById("password");
        const confirmPassword =
            document.getElementById("confirmPassword");
        const message = document.getElementById("message");

        registerForm.addEventListener("submit", function (event) {
            event.preventDefault();

            if (password.value !== confirmPassword.value) {
                message.style.color = "#c0392b";
                message.textContent = "Passwords do not match!";
                confirmPassword.focus();
                return;
            }

            message.style.color = "#167d72";
            message.textContent =
                "Form validated! Connect a backend to create your account.";
        });
    </script>

</body>
</html>
