<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        }

        .login-container h1 {
            text-align: center;
            color: #243b55;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            outline: none;
            font-size: 15px;
        }

        .input-group input:focus {
            border-color: #243b55;
            box-shadow: 0 0 5px rgba(36, 59, 85, 0.2);
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 22px;
            gap: 10px;
        }

        .options a,
        .register-link a {
            color: #243b55;
            text-decoration: none;
            font-weight: bold;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #243b55;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #141e30;
            transform: translateY(-2px);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 14px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #c0392b;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Welcome Back!</h1>
        <p class="subtitle">Login to your account</p>

        <form id="loginForm">

            <div class="input-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    minlength="8"
                    required
                >
            </div>

            <div class="options">
                <label>
                    <input type="checkbox" id="showPassword">
                    Show password
                </label>

                <a href="#" id="forgotPassword">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <p id="message" role="status"></p>

        </form>

        <p class="register-link">
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

    </div>

    <script>
        const password = document.getElementById("password");
        const showPassword = document.getElementById("showPassword");
        const loginForm = document.getElementById("loginForm");
        const message = document.getElementById("message");

        showPassword.addEventListener("change", function () {
            password.type = this.checked ? "text" : "password";
        });

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            message.style.color = "#243b55";
            message.textContent =
                "Form validated! Connect a backend to authenticate your account.";
        });

        document.getElementById("forgotPassword")
            .addEventListener("click", function (event) {
                event.preventDefault();
                message.style.color = "#c0392b";
                message.textContent =
                    "Password recovery is not configured yet.";
            });
    </script>

</body>
</html>
